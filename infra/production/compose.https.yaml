# Remove this file from COMPOSE_FILE when an existing proxy terminates HTTPS.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set a public DNS hostname for HTTPS}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [app]
    depends_on:
      frontend:
        condition: service_healthy
    mem_limit: 256m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:
