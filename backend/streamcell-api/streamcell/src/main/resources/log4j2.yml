Config:
    name: Log4j2Config
    Properties:
        Property:
            name: LOG_LEVEL_PATTERN
            value: "{%5p}{FATAL=red blink, ERROR=red bold, WARN=yellow bold, INFO=green bold, DEBUG=blue bold, TRACE=blue}"
    Appenders:
        Console:
            name: CONSOLE
            target: SYSTEM_OUT
            PatternLayout:
                disableAnsi: false
                pattern: "%style{%d{MM-dd HH:mm:ss}}{magenta} %highlight${LOG_LEVEL_PATTERN} %style{[%c{1.1.1.*}]}{cyan} %m%n"

        RollingFile:
            name: FILE
            fileName: "logs/application.log"
            filePattern: "logs/application-%d{yyyy-MM-dd}-%i.log.gz"
            PatternLayout:
                pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
            Policies:
                SizeBasedTriggeringPolicy:
                    size: "10MB"
            DefaultRolloverStrategy:
                max: "30"

    Loggers:
        Root:
            level: INFO
            AppenderRef:
                - ref: CONSOLE
                - ref: FILE
        Logger:
            - name: com.example.project
              level: DEBUG
              additivity: false
              AppenderRef:
                  - ref: CONSOLE
                  - ref: FILE
