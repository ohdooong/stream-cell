server:
  port: 8085
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  datasource:
    # Production uses the real driver, not log4jdbc's jdbc:log4jdbc: URL.
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

flink:
  kafka:
    bootstrap-servers:
      - kafka-1:9092
      - kafka-2:9092
      - kafka-3:9092

file:
  upload:
    dir: /data/uploads
    custom-jar-path: /data/uploads/flink/artifacts

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  config: classpath:log4j2-prod.xml
  level:
    com.streamcell: INFO
    org.mybatis: WARN
    org.apache.ibatis: WARN
    # The existing interceptor logs Atlas credentials and request/response bodies.
    com.streamcell.global.interceptor.RestClientLoggingInterceptor: OFF
